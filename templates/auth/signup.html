{% extends "base.html" %}
{% block title %}Sign up — Post It{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="brand">
    <img src="{{ logo_url }}" alt="Post It logo">
  </div>
  <h1 class="center">Stick your first note 📌</h1>
  <form action="/signup" method="POST">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required maxlength="80" placeholder="Your display name">
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="4" placeholder="Pick something strong-ish">
    </div>
    <button type="submit" style="width:100%">Create my world 🌍</button>
  </form>
  <p class="center muted">Already here? <a href="/login">Log in</a></p>
</div>
{% endblock %}
