{% extends "base.html" %}
{% block title %}New listing — Post It Market{% endblock %}
{% block content %}
<h1 class="page-title">🏷 Sell something</h1>
<form class="card" action="/market/new" method="POST" enctype="multipart/form-data">
  <div class="field">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" required maxlength="120" placeholder="What are you selling?">
  </div>
  <div class="field">
    <label for="category">Category</label>
    <select id="category" name="category" required>
      {% for cat in categories %}
      <option value="{{ cat }}">{{ cat }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="price">Price ($)</label>
    <input type="number" id="price" name="price" min="0" step="0.01" required placeholder="25.00">
  </div>
  <div class="field">
    <label for="description">Description</label>
    <textarea id="description" name="description" placeholder="Condition, details, why you're selling…"></textarea>
  </div>
  <div class="field">
    <label for="photos">Photos (you can pick several)</label>
    <input type="file" id="photos" name="photos" accept="image/*" multiple>
  </div>
  <div class="field">
    <label><input type="checkbox" name="shipping" value="1"> 📦 I'll ship this item</label>
  </div>
  <div class="field">
    <label for="meetup_city">Meetup city (for local deals)</label>
    <input type="text" id="meetup_city" name="meetup_city" maxlength="80" placeholder="e.g. Chicago">
  </div>
  <button type="submit">List it! 🏷</button>
  <a class="btn btn-ghost" href="/market">Cancel</a>
</form>
{% endblock %}
