# Post It — one-click Render deploy (Blueprint)
# In Render: New → Blueprint → connect the repo containing this file.
# The Starter plan (~$7/mo) includes a persistent disk mounted at /data;
# POSTIT_DB / POSTIT_UPLOADS point the app at it so data and uploads
# survive restarts and redeploys.
services:
  - type: web
    name: postit
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    disk:
      name: postit-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: POSTIT_DB
        value: /data/postit.db
      - key: POSTIT_UPLOADS
        value: /data/uploads
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_VERIFIED_ENABLED
        value: "0"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
